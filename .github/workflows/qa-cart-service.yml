name: CI - QA - Cart Service

on:
  push:
    branches: [ "qa" ]
    paths:
      - 'apps/cart/cart-service/**'
      - '.github/workflows/qa-cart-service.yml'
  pull_request:
    branches: [ "qa" ]
    paths:
      - 'apps/cart/cart-service/**'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/cart/cart-service
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd apps/cart/cart-service
          pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: rommela462
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t rommela462/cart-service:qa-latest ./apps/cart/cart-service
          docker push rommela462/cart-service:qa-latest
