name: QA - User Update Service

on:
  push:
    branches:
      - qa
    paths:
      - 'apps/user/user-update-service/**'
      - '.github/workflows/qa-user-update.yml'
  pull_request:
    branches:
      - qa
    paths:
      - 'apps/user/user-update-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r apps/user/user-update-service/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd apps/user/user-update-service
          PYTHONPATH=. pytest tests/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: rommela462
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t rommela462/user-update-service:qa-latest ./apps/user/user-update-service
          docker push rommela462/user-update-service:qa-latest
