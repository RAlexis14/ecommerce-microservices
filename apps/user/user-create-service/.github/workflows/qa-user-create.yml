name: QA - User Create Service

on:
  push:
    branches:
      - qa
    paths:
      - 'apps/user/user-create-service/**'
      - '.github/workflows/qa-user-create.yml'
  pull_request:
    branches:
      - qa
    paths:
      - 'apps/user/user-create-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r apps/user/user-create-service/requirements.txt

      - name: Run tests
        run: |
          echo "No tests implemented yet for user-create-service"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: rommela462
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t rommela462/user-create-service:qa-latest ./apps/user/user-create-service
          docker push rommela462/user-create-service:qa-latest
