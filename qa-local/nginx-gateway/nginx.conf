events {}

http {
    upstream user_create {
        server user-create-service:5000;
    }
    upstream user_read {
        server user-read-service:5000;
    }
    upstream user_update {
        server user-update-service:5000;
    }
    upstream user_delete {
        server user-delete-service:5000;
    }
    upstream user_recovery {
        server user-password-recovery-service:5000;
    }
    upstream user_roles {
        server user-role-management-service:5000;
    }
    upstream product_catalog {
        server product-catalog-service:5000;
    }
    upstream inventory {
        server inventory-service:5000;
    }
    upstream order {
        server order-placement-service:5000;
    }
    upstream cart {
        server cart-service:5000;
    }

    server {
        listen 80;

        # USER CREATE
        location /users/create {
            proxy_pass http://user_create/users/create;
        }

        # USER READ
        location /users/read {
            proxy_pass http://user_read/users/read;
        }

        # USER UPDATE
        location /users/update {
            proxy_pass http://user_update/users/update;
        }

        # USER DELETE
        location /users/delete {
            proxy_pass http://user_delete/users/delete;
        }


        # PASSWORD RECOVERY
        location /users/password-recovery {
            proxy_pass http://user_recovery/users/password-recovery;
        }

        # ROLES
        location /users/roles {
            proxy_pass http://user_roles/users/roles;
        }

        # PRODUCTS
        location /products/create {
             proxy_pass http://product_catalog/products/create;
        }

        location /products/list/ {
            proxy_pass http://product_catalog/products/list/;
        }


        # INVENTORY
        location /inventory/add {
            proxy_pass http://inventory/inventory/add;
        }

        location /inventory/list/ {
            proxy_pass http://inventory/inventory/list/;
        }


        # ORDER
        location /orders/create {
             proxy_pass http://order/orders/create;
        }

        location /orders/list/ {
            proxy_pass http://order/orders/list/;
        }


        # CART
        
        location /cart/add {
            proxy_pass http://cart/cart/add;
        }

        location /cart/get/ {
            proxy_pass http://cart/cart/get/;
        }

        location /cart/clear/ {
            proxy_pass http://cart/cart/clear/;
        }




    }
}
